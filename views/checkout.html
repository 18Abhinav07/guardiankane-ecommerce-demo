<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Trailhead Goods</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <a class="logo" href="/">Trailhead Goods</a>
    <nav>
      <a href="/">Shop</a>
      <a id="cart-link" href="/cart.html">Cart <span id="cart-count" class="hidden">0</span></a>
      <a id="account-link" href="/signin.html">Sign in</a>
    </nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <div id="checkout-summary"></div>
    <section class="payment-section">
      <h2>Payment</h2>
      <form id="payment-form">
        <label>Card number
          <input type="text" id="card-number" name="cardNumber" autocomplete="cc-number" />
        </label>
        <label>Expiry (MM/YY)
          <input type="text" id="card-expiry" name="expiry" autocomplete="cc-exp" placeholder="MM/YY" />
        </label>
        <label>CVV
          <input type="text" id="card-cvv" name="cvv" autocomplete="cc-csc" />
        </label>
        <p id="payment-error" class="form-error hidden"></p>
        <button class="primary" type="submit">Place order</button>
      </form>
    </section>
  </main>
  <script src="/checkout.js"></script>
  <script src="/account.js"></script>
</body>
</html>
